<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="description" content="Bat Sonar — navigate the dark cave using echolocation to find the bug! Levels, lives and a timer." />
<title>🦇 Bat Sonar — Little Players</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦇</text></svg>" />
<style>
  :root {
    --bg: #09090b; --card: #18181b; --ink: #f4f4f5; --muted: #a1a1aa;
    --accent: #6d28d9; --accent2: #4c1d95; --good: #22c55e; --bad: #ef4444;
    --wall: #22d3ee; --shadow: 0 10px 28px rgba(0,0,0,.5); --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { overscroll-behavior: none; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  header { text-align: center; margin: 10px 0 4px; }
  h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.6rem); color: var(--wall); }
  .sub { margin: 5px 0 0; color: var(--muted); font-weight: 700; }
  
  .scoreboard { display: flex; gap: 9px; margin: 14px 0 6px; flex-wrap: wrap; justify-content: center; }
  .pill { background: var(--card); border-radius: 999px; padding: 7px 14px; font-weight: 800;
    box-shadow: var(--shadow); font-size: .9rem; display: flex; align-items: center; gap: 5px; }

  .timerwrap { width: min(460px, 92vw); margin: 6px 0 2px; }
  .timerbar { height: 11px; border-radius: 999px; background: #27272a; overflow: hidden; }
  .timerfill { height: 100%; width: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #22c55e, #4ade80); transition: width .25s linear; }
  .timerfill.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .timerfill.danger { background: linear-gradient(90deg, #ef4444, #f87171); }

  .stage { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px; margin-top: 10px; touch-action: none; position: relative; }
  canvas { display: block; border-radius: 10px; background: #000; touch-action: none; }

  .ping-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(34, 211, 238, 0.2); border: 2px solid var(--wall); color: var(--wall);
    font-size: 1.2rem; font-weight: 900; padding: 8px 24px; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(4px); transition: transform 0.1s; }
  .ping-btn:active { transform: translateX(-50%) scale(0.95); }

  .feedback { text-align: center; min-height: 1.5em; font-weight: 800; font-size: 1.1rem; margin: 10px 0 0; }
  .feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
  .hearts { font-size: 1.05rem; letter-spacing: 2px; }

  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px);
    gap: 8px; margin: 16px 0 4px; justify-content: center; }
  .dpad button { border: none; cursor: pointer; font-size: 1.8rem; font-weight: 800; color: #fff;
    border-radius: 16px; background: linear-gradient(180deg, var(--accent), var(--accent2));
    box-shadow: 0 5px 0 #3b0764; transition: transform .07s, box-shadow .07s; }
  .dpad button:active { transform: translateY(4px); box-shadow: 0 1px 0 #3b0764; }
  .du { grid-column: 2; grid-row: 1; } .dl { grid-column: 1; grid-row: 2; }
  .dd { grid-column: 2; grid-row: 2; } .dr { grid-column: 3; grid-row: 2; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 9; }
  .overlay.show { display: flex; }
  .panel { background: var(--card); border-radius: 22px; padding: 30px 26px; text-align: center;
    box-shadow: var(--shadow); width: min(420px, 92vw); }
  .panel h2 { margin: 0 0 6px; font-size: 1.8rem; color: var(--wall); }
  .panel p { margin: 6px 0; color: var(--muted); font-weight: 700; }
  .panel .big { font-size: 2.4rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
  .panel button { margin-top: 14px; border: none; cursor: pointer; font: inherit; font-weight: 800;
    padding: 13px 26px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 1.1rem; }

  .note { margin-top: 8px; font-size: .82rem; color: var(--muted); text-align: center; }
  .back { margin-top: 14px; }
  .back a { color: var(--wall); font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
  <header>
    <h1>🦇 Bat Sonar</h1>
    <p class="sub">Use sonar to find the 🦟 bug in the dark cave!</p>
  </header>

  <div class="scoreboard">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">📈 Lvl <span id="level">1</span></div>
    <div class="pill">🔊 Pings <span id="pings">0</span></div>
    <div class="pill hearts" id="hearts">❤️❤️❤️</div>
  </div>

  <div class="timerwrap"><div class="timerbar"><div class="timerfill" id="timerfill"></div></div></div>

  <div class="stage">
    <canvas id="maze" width="420" height="420"></canvas>
    <button class="ping-btn" id="pingBtn">🔊 PING</button>
  </div>
  <p class="feedback" id="feedback"></p>

  <div class="dpad">
    <button class="du" data-dir="N">▲</button>
    <button class="dl" data-dir="W">◀</button>
    <button class="dd" data-dir="S">▼</button>
    <button class="dr" data-dir="E">▶</button>
  </div>
  <p class="note">Tap Ping to see the walls! Swipe or use the D-pad to move.</p>

  <p class="back"><a href="https://littleplayers.github.io/">← Back to Little Players</a></p>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h2 id="ovTitle">Game Over</h2>
      <p id="ovMsg"></p>
      <div class="big" id="ovScore">0</div>
      <button id="ovBtn">▶ Play Again</button>
    </div>
  </div>

<script>
  const SK="bat_best";
  const $=id=>document.getElementById(id);
  const cv=$("maze"), ctx=cv.getContext("2d"), fb=$("feedback"), fill=$("timerfill");

  let score=0, level=1, lives=3, won=0, pingsUsed=0;
  let best=0;
  let N, cells, px, py, cell, pad=8;
  let timeLeft, timeMax, timer=null, running=false;
  
  let pingActive = 0; // opacity of walls
  let pingInterval = null;

  function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

  // recursive backtracker maze
  function genMaze(n){
    const g=[];
    for(let y=0;y<n;y++){const row=[];for(let x=0;x<n;x++)row.push({walls:[true,true,true,true],seen:false});g.push(row);}
    const stack=[[0,0]]; g[0][0].seen=true;
    const DIRS=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
    while(stack.length){
      const [cx,cy]=stack[stack.length-1];
      const opts=[];
      for(const[dx,dy,wt,wo] of DIRS){
        const nx=cx+dx, ny=cy+dy;
        if(nx>=0&&ny>=0&&nx<n&&ny<n&&!g[ny][nx].seen) opts.push([nx,ny,wt,wo]);
      }
      if(opts.length){
        const [nx,ny,wt,wo]=opts[ri(0,opts.length-1)];
        g[cy][cx].walls[wt]=false; g[ny][nx].walls[wo]=false;
        g[ny][nx].seen=true; stack.push([nx,ny]);
      } else stack.pop();
    }
    return g;
  }

  function fitCanvas(){
    const max=Math.min(460, window.innerWidth-56);
    cell=Math.floor((max-pad*2)/N);
    const dim=cell*N+pad*2;
    cv.width=dim; cv.height=dim;
  }

  function newLevel(){
    N=6 + Math.floor(level/2);
    cells=genMaze(N);
    px=0; py=0; pingsUsed=0; pingActive=1.0; 
    fitCanvas();
    timeMax=40 + level*5;
    timeLeft=timeMax;
    fb.textContent=""; fb.className="feedback";
    paint(); draw(); startTimer();
    startPingFade();
  }

  function startPingFade() {
    if(pingInterval) clearInterval(pingInterval);
    pingInterval = setInterval(() => {
      if(pingActive > 0) {
        pingActive -= 0.05;
        if(pingActive < 0) pingActive = 0;
        draw();
      }
    }, 50);
  }

  function doPing() {
    if(!running) return;
    SFX.ping();
    pingActive = 1.0;
    pingsUsed++;
    $("pings").textContent = pingsUsed;
    draw();
  }
  $("pingBtn").onclick = doPing;

  function startTimer(){
    stopTimer(); running=true; updateBar();
    timer=setInterval(()=>{ timeLeft-=0.1;
      if(timeLeft<=0){timeLeft=0; updateBar(); timeUp();} else updateBar(); },100);
  }
  function stopTimer(){ if(timer){clearInterval(timer);timer=null} running=false; }
  function updateBar(){
    const pct=Math.max(0,(timeLeft/timeMax)*100);
    fill.style.width=pct+"%";
    fill.className="timerfill"+(pct<25?" danger":pct<50?" warn":"");
  }

  const SFX = (function(){
    let ctx=null;
    function getCtx(){
      if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) ctx=new AC(); }
      if(ctx&&ctx.state==="suspended") ctx.resume(); return ctx;
    }
    return {
      step(){
        const c=getCtx(); if(!c) return;
        const o=c.createOscillator(), g=c.createGain();
        o.type="sine"; o.frequency.setValueAtTime(400, c.currentTime);
        g.gain.setValueAtTime(0.04, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.03);
        o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.03);
      },
      ping(){
        const c=getCtx(); if(!c) return;
        const o=c.createOscillator(), g=c.createGain();
        o.type="sine"; o.frequency.setValueAtTime(800, c.currentTime);
        o.frequency.exponentialRampToValueAtTime(1200, c.currentTime+0.3);
        g.gain.setValueAtTime(0.1, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.3);
        o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.3);
      },
      win(){
        const c=getCtx(); if(!c) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq,i)=>{
          const o=c.createOscillator(), g=c.createGain();
          o.type="sine"; o.frequency.setValueAtTime(freq, c.currentTime+i*0.08);
          g.gain.setValueAtTime(0.2, c.currentTime+i*0.08);
          g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+i*0.08+0.3);
          o.connect(g); g.connect(c.destination); o.start(c.currentTime+i*0.08); o.stop(c.currentTime+i*0.08+0.3);
        });
      },
      crash(){
        const c=getCtx(); if(!c) return;
        const o=c.createOscillator(), g=c.createGain();
        o.type="square"; o.frequency.setValueAtTime(100, c.currentTime);
        o.frequency.exponentialRampToValueAtTime(40, c.currentTime+0.2);
        g.gain.setValueAtTime(0.15, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.2);
        o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.2);
      }
    };
  })();

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    
    // Draw walls only if ping is active
    if(pingActive > 0) {
      ctx.strokeStyle = `rgba(34, 211, 238, ${pingActive})`;
      ctx.lineWidth = Math.max(2, cell*0.10); ctx.lineCap = "round";
      for(let y=0; y<N; y++) {
        for(let x=0; x<N; x++) {
          const c=cells[y][x], X=pad+x*cell, Y=pad+y*cell;
          ctx.beginPath();
          if(c.walls[0]){ctx.moveTo(X,Y);ctx.lineTo(X+cell,Y);}
          if(c.walls[1]){ctx.moveTo(X+cell,Y);ctx.lineTo(X+cell,Y+cell);}
          if(c.walls[2]){ctx.moveTo(X+cell,Y+cell);ctx.lineTo(X,Y+cell);}
          if(c.walls[3]){ctx.moveTo(X,Y+cell);ctx.lineTo(X,Y);}
          ctx.stroke();
        }
      }
      
      // Goal is also visible during ping
      ctx.fillStyle = `rgba(255, 255, 255, ${pingActive})`;
      ctx.font = `${cell*0.6}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🦟", pad+(N-0.5)*cell, pad+(N-0.5)*cell);
    }
    
    // Player is always visible
    ctx.font = `${cell*0.7}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🦇", pad+(px+0.5)*cell, pad+(py+0.5)*cell);
  }

  function move(dir){
    if(!running) return;
    const c=cells[py][px];
    let moved=false; let crashed=false;
    if(dir==="N") { if(!c.walls[0]) { py--; moved=true; } else crashed=true; }
    else if(dir==="E") { if(!c.walls[1]) { px++; moved=true; } else crashed=true; }
    else if(dir==="S") { if(!c.walls[2]) { py++; moved=true; } else crashed=true; }
    else if(dir==="W") { if(!c.walls[3]) { px--; moved=true; } else crashed=true; }
    
    if(crashed) {
      SFX.crash();
      pingActive = 1.0; draw(); // Show them what they hit
      loseLife("💥 You hit a wall!");
    } else if(moved) {
      SFX.step();
      draw();
      if(px===N-1 && py===N-1) winLevel();
    }
  }

  function winLevel(){
    stopTimer(); SFX.win();
    pingActive = 1.0; draw(); // reveal full map
    const timeBonus=Math.round(timeLeft*2);
    const pts=20 + timeBonus + level*5 - (pingsUsed * 2);
    const finalPts = Math.max(5, pts);
    won++; level++; score+=finalPts;
    paint();
    fb.textContent=`🎉 Bug caught! +${finalPts}`; fb.className="feedback good";
    setTimeout(newLevel,1500);
  }

  function loseLife(msg) {
    stopTimer(); lives--; paint();
    fb.textContent=msg; fb.className="feedback bad";
    if(lives<=0) setTimeout(gameOver,1500);
    else setTimeout(()=>{
      px=0; py=0; pingsUsed=0; pingActive=1.0; 
      timeLeft=timeMax; fb.textContent=""; fb.className="feedback"; 
      draw(); startTimer(); startPingFade();
    }, 1500);
  }

  function timeUp(){
    SFX.crash();
    loseLife("⏰ The bug escaped!");
  }

  function gameOver(){
    stopTimer();
    SFX.crash();
    $("ovTitle").textContent="Game Over";
    $("ovMsg").textContent=`You caught ${won} bug${won===1?"":"s"}.`;
    $("ovScore").textContent=score+" pts";
    $("overlay").classList.add("show");
  }

  function startGame(){
    score=0; level=1; lives=3; won=0;
    $("overlay").classList.remove("show");
    paint(); newLevel();
  }

  function paint(){
    $("score").textContent=score;
    $("level").textContent=level; $("pings").textContent=pingsUsed;
    $("hearts").textContent="❤️".repeat(Math.max(0,lives))+"🤍".repeat(Math.max(0,3-lives));
  }

  document.querySelectorAll(".dpad button").forEach(b=>{
    b.onclick=()=>move(b.dataset.dir);
  });
  document.addEventListener("keydown",e=>{
    const map={ArrowUp:"N",ArrowRight:"E",ArrowDown:"S",ArrowLeft:"W",w:"N",d:"E",s:"S",a:"W"};
    if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
    if(e.code === "Space") { e.preventDefault(); doPing(); }
  });

  let sx=0,sy=0,st=false;
  cv.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=true;},{passive:true});
  cv.addEventListener("touchend",e=>{
    if(!st)return; st=false;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20) { doPing(); return; } // Tap to ping
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?"E":"W"); else move(dy>0?"S":"N");
  },{passive:false});

  $("ovBtn").onclick=startGame;
  window.addEventListener("resize",()=>{ if(N){ fitCanvas(); draw(); } });

  startGame();
</script>
  <script src="../game-shell.js?v=20260825"></script>
</body>
</html>
