<head>

  <script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Pendulum Painter","url":"https://littleplayers.github.io/pendulum-painter/","image":"https://littleplayers.github.io/og-image.png","description":"Explore swing length, arc and rhythm to make graceful motion art.","applicationCategory":"Game","operatingSystem":"Web Browser","author":{"@type":"Organization","name":"Little Players"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"isPartOf":{"@type":"WebSite","name":"Little Players","url":"https://littleplayers.github.io/"}}</script>
  <script>(function(){var s=localStorage.getItem("lp_theme"),d=s==="dark"||(!s&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body data-lab-game="pendulumPainter">
  <main id="gameRoot"></main>
  <script src="../game-shell.js"></script>
  <script>
(() => {
  const games = {};
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, props = {}, kids = []) => {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k === "style") Object.assign(node.style, v);
      else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    });
    kids.forEach((kid) => node.append(kid));
    return node;
  };
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  function injectStyles() {
    if ($("#lp-lab-style")) return;
    document.head.append(el("style", { id: "lp-lab-style", html: `
      :root{--lab-bg:#f7fbff;--lab-card:#fff;--lab-ink:#172033;--lab-muted:#5d6980;--lab-accent:#5b6cff;--lab-good:#16a34a;--lab-bad:#e11d48;--lab-line:#dce5f6;--lab-shadow:0 14px 34px rgba(39,51,91,.14)}
      [data-theme="dark"]{--lab-bg:#0f1123;--lab-card:#181b36;--lab-ink:#f4f3fd;--lab-muted:#b9b4d9;--lab-line:#353a67;--lab-shadow:0 16px 38px rgba(0,0,0,.36)}
      *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--lab-bg),#eef7ff);color:var(--lab-ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif} [data-theme="dark"] body{background:#0f1123!important}
      .lab-app{width:min(1120px,94vw);margin:0 auto;padding:28px 0 54px}.lab-hero{display:grid;gap:10px;text-align:center;margin:0 auto 18px}.lab-kicker{font-weight:900;color:var(--lab-accent);letter-spacing:.04em;text-transform:uppercase;font-size:.8rem}.lab-hero h1{margin:0;font-size:clamp(2rem,6vw,3.5rem);line-height:1;font-family:Fredoka,system-ui,sans-serif}.lab-hero p{margin:0 auto;color:var(--lab-muted);font-weight:700;max-width:680px;line-height:1.55}
      .lab-shell{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.75fr);gap:18px;align-items:start}.lab-card{background:var(--lab-card);border:1px solid var(--lab-line);border-radius:18px;box-shadow:var(--lab-shadow);padding:18px}.lab-card h2,.lab-card h3{margin:0 0 10px;font-family:Fredoka,system-ui,sans-serif}.lab-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lab-stat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--lab-line);background:rgba(91,108,255,.08);padding:8px 12px;border-radius:999px;font-weight:900}.lab-btn{border:0;border-radius:999px;background:var(--lab-accent);color:#fff;font:900 1rem/1 system-ui,sans-serif;padding:11px 16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.16)}.lab-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}.lab-btn:disabled{opacity:.62;cursor:not-allowed;transform:none}.lab-btn.secondary{background:#14b8a6}.lab-btn.warn{background:#f59e0b;color:#2f1f00}.lab-btn.ghost{background:#edf1ff;color:#3340a0}[data-theme="dark"] .lab-btn.ghost{background:#252a55;color:#f4f3fd}.lab-msg{min-height:1.5em;font-weight:900;color:var(--lab-muted)}.lab-msg.good{color:var(--lab-good)}.lab-msg.bad{color:var(--lab-bad)}.lab-grid{display:grid;gap:6px;touch-action:manipulation}.lab-cell{border:1px solid var(--lab-line);border-radius:10px;background:#f8fbff;min-height:54px;display:grid;place-items:center;font-size:1.55rem;font-weight:900;cursor:pointer;user-select:none;position:relative;overflow:hidden}.lab-cell.on{outline:3px solid #ffd23f}.lab-cell.beam{background:#fff6bf}.lab-cell.block{background:#334155;color:#fff}.lab-cell.target{background:#dcfce7}.lab-cell.source{background:#dbeafe}.lab-cell.path::after{content:"";position:absolute;inset:45% 4px auto;height:5px;border-radius:999px;background:#ffd23f;box-shadow:0 0 16px #ffd23f}.lab-palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:10px}.lab-swatch{border:0;border-radius:16px;min-height:76px;cursor:pointer;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);box-shadow:0 5px 0 rgba(0,0,0,.16)}.lab-color-sample{height:130px;border-radius:18px;border:1px solid var(--lab-line);box-shadow:inset 0 0 0 5px rgba(255,255,255,.4)}.lab-scene{position:relative;min-height:260px;border:1px solid var(--lab-line);border-radius:18px;background:linear-gradient(#dff7ff 0 58%,#a7f3d0 58%);overflow:hidden}.lab-scene.space{background:radial-gradient(circle at 15% 18%,#fff 0 2px,transparent 3px),radial-gradient(circle at 74% 30%,#fff 0 2px,transparent 3px),linear-gradient(#24325f,#10162e 62%,#25304b 62%)}.lab-scene svg{position:absolute;inset:0;width:100%;height:100%}.lab-meter{height:10px;border-radius:999px;background:rgba(91,108,255,.14);border:1px solid var(--lab-line);overflow:hidden}.lab-meter span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#14b8a6,#f59e0b,#ec4899)}.lab-slider{width:100%;accent-color:var(--lab-accent)}.lab-control{display:grid;gap:6px;min-width:150px;flex:1}.lab-control label{font-weight:900;color:var(--lab-muted)}.rhythm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rhythm-pad{min-height:108px;border:0;border-radius:18px;color:white;font:900 1.05rem/1.1 system-ui,sans-serif;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .12s ease,filter .12s ease}.rhythm-pad.active,.rhythm-pad:active{transform:translateY(5px) scale(.98);filter:saturate(1.3) brightness(1.12);box-shadow:0 2px 0 rgba(0,0,0,.2)}.pendulum-art{width:100%;min-height:260px;border:1px solid var(--lab-line);border-radius:18px;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.7),transparent 18%),var(--lab-card)}.scale{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;align-items:end}.pan{min-height:128px;border:3px dashed var(--lab-line);border-radius:18px;background:rgba(91,108,255,.06);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px}.beam-center{height:10px;background:#64748b;border-radius:999px;margin-bottom:34px}.treasure{border:1px solid var(--lab-line);background:#fff8dc;border-radius:16px;padding:10px 12px;font-size:1.65rem;cursor:pointer}.treasure.sel{outline:3px solid #ffd23f}.map-grid{grid-template-columns:repeat(var(--size),1fr)}.map-grid .lab-cell{aspect-ratio:1;min-height:auto}.build-grid{grid-template-columns:repeat(7,1fr);background:#dbeafe;padding:8px;border-radius:18px}.build-grid .lab-cell{aspect-ratio:1;min-height:auto;background:#eef6ff}.build-grid .solid{background:#64748b;color:#fff}.build-grid .wood{background:#c08448}.build-grid .stone{background:#94a3b8}.build-grid .glass{background:#7dd3fc}.build-grid .roof{background:#ef4444}.material{border:1px solid var(--lab-line);background:var(--lab-card);border-radius:14px;padding:10px;cursor:pointer;font-weight:900}.material.on{outline:3px solid #ffd23f}.stars{font-size:1.25rem;letter-spacing:2px;color:#f59e0b}@media(max-width:820px){.lab-shell{grid-template-columns:1fr}.lab-card{padding:14px}.lab-cell{min-height:46px}.scale{grid-template-columns:1fr}.beam-center{display:none}.rhythm-pad{min-height:88px}}` }));
  }

  function layout(meta, render) {
    injectStyles();
    const root = $("#gameRoot") || document.body.appendChild(el("div", { id: "gameRoot" }));
    root.className = "lab-app";
    root.innerHTML = `<section class="lab-hero"><div class="lab-kicker">${meta.kicker}</div><h1>${meta.icon} ${meta.title}</h1><p>${meta.desc}</p></section><section class="lab-shell"><div class="lab-card" id="play"></div><aside class="lab-card" id="side"></aside></section>`;
    render($("#play", root), $("#side", root));
  }


  games.pendulumPainter = () => {
    const stages = [
      { name: "Gentle Swing", length: 120, arc: 26, twist: 24 },
      { name: "Wide Loop", length: 150, arc: 42, twist: 36 },
      { name: "Tiny Orbit", length: 86, arc: 54, twist: 58 },
      { name: "Calm Ribbon", length: 170, arc: 24, twist: 70 },
      { name: "Festival Spiral", length: 135, arc: 62, twist: 82 },
      { name: "Gallery Finale", length: 160, arc: 48, twist: 96 }
    ];
    let level=0,length=120,arc=32,twist=45,msg="Tune the pendulum, then swing the brush to paint.",medals=Array(stages.length).fill(0),drawn=70,anim=0,painting=false;
    const points = () => {
      const pts=[];
      for(let i=0;i<240;i++){const t=i/18,fade=1-i/310,a=Math.sin(t)*arc*fade*Math.PI/180,x=210+Math.sin(a)*length+Math.sin(t*twist/38)*34,y=24+Math.cos(a)*length+i*.42;pts.push([clamp(x,18,402),clamp(y,18,222)])}
      return pts;
    };
    const score = () => {const s=stages[level];return Math.max(0,100-Math.round((Math.abs(length-s.length)+Math.abs(arc-s.arc)*1.5+Math.abs(twist-s.twist)*.8)/2.1))};
    const medal = (v)=>v>90?3:v>76?2:v>60?1:0, stars=(n)=>n===3?"★★★":n===2?"★★☆":n===1?"★☆☆":"☆☆☆";
    layout({kicker:"Physics Art",icon:"〰️",title:"Pendulum Painter",desc:"Explore swing length, arc and rhythm to make graceful motion art."},(play,side)=>{
      function swing(){cancelAnimationFrame(anim);painting=true;drawn=1;msg='Brush is swinging. Watch the path grow.';let start=0;const step=t=>{if(!start)start=t;drawn=clamp(Math.ceil((t-start)/12),1,240);paint();if(drawn<240)anim=requestAnimationFrame(step);else{painting=false;msg='Painting finished. Frame it or tune another motion.';paint()}};anim=requestAnimationFrame(step)}
      function paint(){const sc=score(),m=medal(sc),s=stages[level],pts=points(),shown=pts.slice(0,drawn),bob=shown[shown.length-1]||pts[0],trail=shown.map(p=>p.join(",")).join(" ");play.innerHTML=`<div class="lab-row" style="justify-content:space-between;margin-bottom:12px"><span class="lab-stat">Gallery ${level+1}/${stages.length}</span><span class="lab-stat">Match ${sc}%</span><span class="lab-stat">${s.name}</span></div><svg class="pendulum-art" viewBox="0 0 420 240" aria-label="Pendulum painting"><line x1="210" y1="18" x2="${bob[0]}" y2="${bob[1]}" stroke="#94a3b8" stroke-width="3"/><circle cx="210" cy="18" r="7" fill="#64748b"/><polyline points="${trail}" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" opacity=".88"/><circle cx="${bob[0]}" cy="${bob[1]}" r="12" fill="#f59e0b"/><circle cx="${bob[0]}" cy="${bob[1]}" r="22" fill="none" stroke="#fbbf24" stroke-width="2" opacity=".45"/></svg><div class="lab-row" style="margin-top:14px"><span class="lab-control"><label>String ${length}</label><input class="lab-slider" id="length" type="range" min="70" max="180" value="${length}"></span><span class="lab-control"><label>Arc ${arc}°</label><input class="lab-slider" id="arc" type="range" min="15" max="70" value="${arc}"></span><span class="lab-control"><label>Rhythm ${twist}</label><input class="lab-slider" id="twist" type="range" min="20" max="100" value="${twist}"></span></div><p class="lab-msg ${sc>88?'good':''}">${msg}</p><div class="lab-row"><button class="lab-btn" id="swing" ${painting?'disabled':''}>${painting?'Painting...':'Swing brush'}</button><button class="lab-btn" id="frame">Frame painting</button><button class="lab-btn secondary" id="next">Next gallery</button><button class="lab-btn ghost" id="target">Use target setup</button></div>`;['length','arc','twist'].forEach(id=>{$('#'+id,play).oninput=e=>{cancelAnimationFrame(anim);painting=false;if(id==='length')length=+e.target.value;if(id==='arc')arc=+e.target.value;if(id==='twist')twist=+e.target.value;drawn=70;msg='The pattern changed with the motion. Swing to see it unfold.';paint()}});$('#swing',play).onclick=swing;$('#frame',play).onclick=()=>{medals[level]=Math.max(medals[level],m);msg=m>=2?`Beautiful physics art: ${sc}/100.`:`Score ${sc}/100. Match the gallery prompt more closely.`;paint()};$('#next',play).onclick=()=>{cancelAnimationFrame(anim);painting=false;level=(level+1)%stages.length;drawn=70;msg=`New gallery prompt: ${stages[level].name}.`;paint()};$('#target',play).onclick=()=>{cancelAnimationFrame(anim);painting=false;length=s.length;arc=s.arc;twist=s.twist;drawn=1;msg='Target setup loaded. Swing the brush to paint it.';paint()};side.innerHTML=`<h2>Motion notes</h2><p class="stars">${stars(Math.max(medals[level],m))}</p><p>Longer strings swing wider and slower. A bigger arc adds energy. Rhythm changes the layered pattern.</p>`}
      paint();
    });
  };

  games.pendulumPainter();
})();
  </script>
</body>
</html>
